name: Gemini preflight
on:
  push:
    branches: [prspec-pilot-preflight-20261110]
    paths: [.github/workflows/prspec-preflight-smoke.yml]
permissions: {}
jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Send one bounded request to Gemini
        id: probe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'CODE'
          import json, os, urllib.error, urllib.request
          outcome='other_error'
          try:
              key=os.environ.get('GEMINI_API_KEY','')
              if not key:
                  outcome='secret_missing'
              else:
                  body={'contents':[{'parts':[{'text':'Reply with exactly OK.'}]}], 'generationConfig':{'maxOutputTokens':256}}
                  req=urllib.request.Request('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent',data=json.dumps(body).encode(),headers={'Content-Type':'application/json','x-goog-api-key':key},method='POST')
                  with urllib.request.urlopen(req,timeout=90) as response:
                      payload=json.load(response)
                  candidates=payload.get('candidates') or []
                  parts=(candidates[0].get('content') or {}).get('parts',[]) if candidates else []
                  outcome='ok' if any(p.get('text') for p in parts) else 'empty_response'
                  usage=payload.get('usageMetadata') or {}
                  print('prompt_token_count:',usage.get('promptTokenCount','not reported'))
                  print('candidate_token_count:',usage.get('candidatesTokenCount','not reported'))
          except urllib.error.HTTPError as exc:
              outcome='http_'+str(exc.code) if exc.code in (400,401,403,404,429,500,503) else 'http_other'
          except urllib.error.URLError:
              outcome='network_error'
          except Exception:
              outcome='other_error'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('outcome='+outcome+'\n')
          print('Gemini preflight category:',outcome)
          CODE
      - name: Gemini ok
        if: steps.probe.outputs.outcome == 'ok'
        run: echo Gemini preflight category
      - name: Gemini secret_missing
        if: steps.probe.outputs.outcome == 'secret_missing'
        run: echo Gemini preflight category
      - name: Gemini empty_response
        if: steps.probe.outputs.outcome == 'empty_response'
        run: echo Gemini preflight category
      - name: Gemini http_400
        if: steps.probe.outputs.outcome == 'http_400'
        run: echo Gemini preflight category
      - name: Gemini http_401
        if: steps.probe.outputs.outcome == 'http_401'
        run: echo Gemini preflight category
      - name: Gemini http_403
        if: steps.probe.outputs.outcome == 'http_403'
        run: echo Gemini preflight category
      - name: Gemini http_404
        if: steps.probe.outputs.outcome == 'http_404'
        run: echo Gemini preflight category
      - name: Gemini http_429
        if: steps.probe.outputs.outcome == 'http_429'
        run: echo Gemini preflight category
      - name: Gemini http_500
        if: steps.probe.outputs.outcome == 'http_500'
        run: echo Gemini preflight category
      - name: Gemini http_503
        if: steps.probe.outputs.outcome == 'http_503'
        run: echo Gemini preflight category
      - name: Gemini http_other
        if: steps.probe.outputs.outcome == 'http_other'
        run: echo Gemini preflight category
      - name: Gemini network_error
        if: steps.probe.outputs.outcome == 'network_error'
        run: echo Gemini preflight category
      - name: Gemini other_error
        if: steps.probe.outputs.outcome == 'other_error'
        run: echo Gemini preflight category
      - name: Require successful Gemini response
        if: steps.probe.outputs.outcome != 'ok'
        run: exit 1
